resources:
  jobs:
    ml_weekly:
      name: smart-meter-ml-weekly
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 8 ? * MON"
        timezone_id: Europe/Brussels
        pause_status: ${var.schedule_pause_status}
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters: &lakehouse_params
        - name: catalog
          default: ${var.catalog}
        - name: landing_schema
          default: ${resources.schemas.landing.name}
        - name: bronze_schema
          default: ${resources.schemas.bronze.name}
        - name: silver_schema
          default: ${resources.schemas.silver.name}
        - name: gold_schema
          default: ${resources.schemas.gold.name}
        - name: ml_schema
          default: ${resources.schemas.ml.name}
        - name: ops_schema
          default: ${resources.schemas.ops.name}
      tasks:
        - task_key: train_and_gate
          notebook_task:
            notebook_path: ../notebooks/10_ml_churn_training.py
        - task_key: batch_score_and_drift
          depends_on: [{task_key: train_and_gate}]
          notebook_task:
            notebook_path: ../notebooks/11_ml_batch_scoring_drift.py

    genai_rag:
      name: smart-meter-genai-rag
      max_concurrent_runs: 1
      parameters: *lakehouse_params
      tasks:
        - task_key: build_index
          notebook_task:
            notebook_path: ../notebooks/20_genai_rag_index.py
        - task_key: evaluate
          depends_on: [{task_key: build_index}]
          notebook_task:
            notebook_path: ../notebooks/21_genai_rag_evaluate.py

    weekly_maintenance:
      name: smart-meter-weekly-maintenance
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 5 ? * SUN"
        timezone_id: Europe/Brussels
        pause_status: ${var.schedule_pause_status}
      parameters: *lakehouse_params
      tasks:
        - task_key: optimize_vacuum_analyze
          notebook_task:
            notebook_path: ../notebooks/05_maintenance_finops.py

    migration_parallel_run:
      name: smart-meter-migration-parallel-run
      parameters: *lakehouse_params
      tasks:
        - task_key: reconcile_legacy_vs_new
          notebook_task:
            notebook_path: ../notebooks/40_migration_parallel_run.py
