# Daily orchestration. Upstream dependencies are explicit task dependencies; at most 4 tasks run at
# the same time (Free Edition allows 5 concurrent job tasks).
#
#   setup -> generate_sources -> medallion_pipeline -> dimensional_model -> data_quality_gate -> freshness_slo
#                                                                       \-> meter_anomalies
resources:
  jobs:
    daily_ingest:
      name: smart-meter-daily-ingest
      max_concurrent_runs: 1
      timeout_seconds: 7200
      schedule:
        quartz_cron_expression: "0 30 6 * * ?"    # 06:30 Brussels, after upstream deliveries
        timezone_id: Europe/Brussels
        pause_status: ${var.schedule_pause_status}
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 3600
      parameters: &lakehouse_params
        - name: catalog
          default: ${var.catalog}
        - name: landing_schema
          default: ${resources.schemas.landing.name}
        - name: bronze_schema
          default: ${resources.schemas.bronze.name}
        - name: silver_schema
          default: ${resources.schemas.silver.name}
        - name: gold_schema
          default: ${resources.schemas.gold.name}
        - name: ml_schema
          default: ${resources.schemas.ml.name}
        - name: ops_schema
          default: ${resources.schemas.ops.name}

      environments:
        - environment_key: wheel_env
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../notebooks/00_setup_governance.py

        - task_key: generate_sources
          depends_on: [{task_key: setup}]
          environment_key: wheel_env
          max_retries: 2
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: smartmeter
            entry_point: generate_sources
            parameters:
              - "--catalog={{job.parameters.catalog}}"
              - "--landing_schema={{job.parameters.landing_schema}}"
              - "--customers=${var.customers}"
              - "--backfill_days=${var.backfill_days}"

        - task_key: medallion_pipeline
          depends_on: [{task_key: generate_sources}]
          max_retries: 1
          pipeline_task:
            pipeline_id: ${resources.pipelines.medallion.id}
            full_refresh: false

        - task_key: dimensional_model
          depends_on: [{task_key: medallion_pipeline}]
          max_retries: 2
          min_retry_interval_millis: 120000
          notebook_task:
            notebook_path: ../notebooks/02_build_dimensional_model.py

        - task_key: data_quality_gate
          depends_on: [{task_key: dimensional_model}]
          notebook_task:
            notebook_path: ../notebooks/03_data_quality_reconciliation.py

        - task_key: meter_anomalies
          depends_on: [{task_key: dimensional_model}]
          max_retries: 1
          notebook_task:
            notebook_path: ../notebooks/12_meter_anomaly_detection.py

        - task_key: freshness_slo
          depends_on: [{task_key: data_quality_gate}]
          notebook_task:
            notebook_path: ../notebooks/04_freshness_slo.py
