name: Deploy to prod

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "notebooks/**", "resources/**", "databricks.yml", "pyproject.toml"]

concurrency: deploy-prod   # never two deployments at the same time

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod        # add required reviewers on this GitHub environment for a manual approval gate
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[dev]" && pytest
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t prod
      - run: databricks bundle deploy -t prod
